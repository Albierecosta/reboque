services:
  postgres:
    image: postgres:16-alpine
    container_name: altum-reboque-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: altum_reboque
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
